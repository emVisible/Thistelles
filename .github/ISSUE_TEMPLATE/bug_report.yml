name: 🐛 Bug 报告
description: 报告 Thistelles 的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写以下信息，便于快速定位问题。
        日志文件位于 `~/.voice-input/app.log`。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 描述问题现象与期望行为
      placeholder: 例如：按下快捷键后没有开始录音，预期应开始录音
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: 芯片
      options:
        - Apple Silicon (M1/M2/M3/M4)
        - Intel
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: "例如：14.5"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 快捷键 / 按住说话
        - 录音
        - 转写结果质量
        - 输出（粘贴/剪贴板）
        - 历史记录
        - 安装 / 启动
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 粘贴 ~/.voice-input/app.log 的最后几行
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 检查项
      options:
        - label: 已尝试重启应用
        - label: 已查看 README 故障排查部分
