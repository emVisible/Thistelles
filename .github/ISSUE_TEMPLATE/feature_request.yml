name: 💡 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 描述当前的使用痛点或场景
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作
    validations:
      required: true

  - type: checkboxes
    id: willingness
    attributes:
      label: 意向
      options:
        - label: 我愿意提交 PR 实现这个功能
